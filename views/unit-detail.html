<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Detail - Luxtronic Rental</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">Luxtronic Rental</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/inventory">Inventory</a>
      <a href="/customers">Customers</a>
      <a href="/rental-history">History</a>
      <a href="/new-rental" class="btn-accent">+ New Rental</a>
    </nav>
  </div>
</header>
<main>
  <h1 id="pageTitle">Unit</h1>
  <p class="subtitle" id="pageSubtitle"></p>
  <div id="loadError"></div>

  <div class="panel">
    <h2>Details</h2>
    <div id="unitInfo"></div>
  </div>

  <div class="panel">
    <h2>Rental History</h2>
    <table>
      <thead><tr><th>Customer</th><th>Start</th><th>Due</th><th>Returned</th><th>Fee</th><th>Bond</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div id="historyEmpty" class="empty" style="display:none;">This unit hasn't been rented out yet.</div>
  </div>

  <div class="actions-bar">
    <a class="btn" href="/inventory">&larr; Back to Inventory</a>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/unitDetail.js"></script>
</body>
</html>
