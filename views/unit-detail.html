<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unit Detail - Luxtronic Rental</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/analysis" class="nav-item"><i class="fas fa-chart-column"></i><span class="nav-text">Analysis</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <h1 id="pageTitle">Unit</h1>
  <p class="subtitle" id="pageSubtitle"></p>
  <div id="loadError"></div>

  <div class="panel">
    <h2>Details</h2>
    <div id="unitInfo"></div>
  </div>

  <div class="panel">
    <h2>Rental History</h2>
    <table>
      <thead><tr><th>Customer</th><th>Start</th><th>Due</th><th>Returned</th><th>Fee</th><th>Bond</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div id="historyEmpty" class="empty" style="display:none;">This unit hasn't been rented out yet.</div>
  </div>

  <div class="actions-bar">
    <a class="btn" href="/inventory">&larr; Back to Inventory</a>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/unitDetail.js"></script>
</body>
</html>
