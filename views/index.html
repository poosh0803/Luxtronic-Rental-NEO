<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Luxtronic Rental</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <h1>Dashboard</h1>
  <p class="subtitle">Units currently rented out, and anything overdue.</p>

  <div id="overdueSection" class="panel" style="display:none;">
    <h2 style="color:var(--danger-text);">Overdue</h2>
    <table>
      <thead><tr><th>Unit</th><th>Customer</th><th>Due Date</th><th>Days Late</th><th></th></tr></thead>
      <tbody id="overdueBody"></tbody>
    </table>
  </div>

  <div class="panel">
    <h2>Currently Rented Out</h2>
    <table>
      <thead><tr><th>Unit</th><th>Type</th><th>Customer</th><th>Start</th><th>Due Back</th><th></th></tr></thead>
      <tbody id="activeBody"></tbody>
    </table>
    <div id="activeEmpty" class="empty" style="display:none;">Nothing is currently rented out.</div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
