<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Detail - Luxtronic Rental</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/analysis" class="nav-item"><i class="fas fa-chart-column"></i><span class="nav-text">Analysis</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
    <h1 id="pageTitle">Rental Detail</h1>
    <a class="btn btn-primary" id="printLink" href="#" target="_blank">Print Rental Agreement</a>
  </div>
  <div id="overdueBanner" class="alert alert-danger" style="display:none; margin-top:16px;"></div>
  <div id="loadError"></div>

  <div class="grid-2">
    <div class="panel">
      <h2>Unit</h2>
      <div id="unitInfo"></div>
    </div>
    <div class="panel">
      <h2>Customer</h2>
      <div id="customerInfo"></div>
    </div>
  </div>

  <div class="panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">Rental Terms</h2>
      <div class="actions-bar" style="margin-top:0;">
        <button class="btn btn-sm" id="editRentalBtn">Edit</button>
        <button class="btn btn-sm btn-danger" id="deleteRentalBtn">Delete</button>
      </div>
    </div>
    <div id="termsInfo"></div>

    <div id="rentalEditForm" style="display:none; margin-top:16px;">
      <div class="field-row">
        <div>
          <label for="editStartDate">Start Date</label>
          <input type="date" id="editStartDate">
        </div>
        <div>
          <label for="editDueDate">Due Date</label>
          <input type="date" id="editDueDate">
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="editRentalFee">Rental Fee ($)</label>
          <input type="number" step="0.01" id="editRentalFee">
        </div>
        <div>
          <label for="editFeeFrequency">Per</label>
          <select id="editFeeFrequency">
            <option value="day">Day</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
          </select>
        </div>
      </div>
      <label for="editFinalFee">Final Rental Fee ($)</label>
      <input type="number" step="0.01" id="editFinalFee" placeholder="Leave blank unless giving a discount off the rate above">
      <label for="editSecurityBond">Security Bond ($)</label>
      <input type="number" step="0.01" id="editSecurityBond">
      <label for="editAccessoriesIncluded">Accessories Included</label>
      <input type="text" id="editAccessoriesIncluded">
      <label for="editNotes">Notes</label>
      <textarea id="editNotes" rows="3"></textarea>
      <div class="actions-bar">
        <button class="btn btn-primary" id="saveRentalBtn">Save</button>
        <button class="btn" id="cancelRentalEditBtn">Cancel</button>
      </div>
      <div id="rentalEditError"></div>
    </div>
    <div id="rentalDeleteError"></div>
  </div>

  <div class="panel">
    <h2>Condition Photos</h2>
    <h2 style="font-size:14px; color:var(--muted);">Checkout</h2>
    <div class="photo-grid" id="checkoutPhotos"></div>
    <div class="actions-bar" style="margin-top:10px;">
      <input type="file" id="addCheckoutPhotoInput" accept="image/*" multiple style="max-width:260px;">
      <button class="btn btn-sm" id="addCheckoutPhotoBtn">Add Photo(s)</button>
    </div>
    <div id="checkoutPhotoError"></div>
    <h2 style="font-size:14px; color:var(--muted); margin-top:16px;">Return</h2>
    <div class="photo-grid" id="returnPhotos"></div>
  </div>

  <div class="panel" id="returnPanel">
    <h2>Return this unit</h2>
    <label for="returnPhotoInput">Return condition photos (optional)</label>
    <input type="file" id="returnPhotoInput" accept="image/*" multiple>
    <div class="actions-bar">
      <button class="btn btn-danger" id="markReturnedBtn">Mark Returned</button>
    </div>
    <div id="returnError"></div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/rentalDetail.js"></script>
</body>
</html>
