<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental Detail - Luxtronic Rental</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <h1 id="pageTitle">Rental Detail</h1>
  <div id="overdueBanner" class="alert alert-danger" style="display:none;"></div>
  <div id="loadError"></div>

  <div class="grid-2">
    <div class="panel">
      <h2>Unit</h2>
      <div id="unitInfo"></div>
    </div>
    <div class="panel">
      <h2>Customer</h2>
      <div id="customerInfo"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Rental Terms</h2>
    <div id="termsInfo"></div>
  </div>

  <div class="panel">
    <h2>Condition Photos</h2>
    <h2 style="font-size:14px; color:var(--muted);">Checkout</h2>
    <div class="photo-grid" id="checkoutPhotos"></div>
    <h2 style="font-size:14px; color:var(--muted); margin-top:16px;">Return</h2>
    <div class="photo-grid" id="returnPhotos"></div>
  </div>

  <div class="panel" id="returnPanel">
    <h2>Return this unit</h2>
    <label for="returnPhotoInput">Return condition photos (optional)</label>
    <input type="file" id="returnPhotoInput" accept="image/*" multiple>
    <div class="actions-bar">
      <button class="btn btn-danger" id="markReturnedBtn">Mark Returned</button>
    </div>
    <div id="returnError"></div>
  </div>

  <div class="actions-bar">
    <a class="btn btn-primary" id="printLink" href="#" target="_blank">Print Rental Agreement</a>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/rentalDetail.js"></script>
</body>
</html>
