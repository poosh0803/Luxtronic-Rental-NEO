<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rental History - Luxtronic Rental</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a href="/" class="brand">Luxtronic Rental</a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/inventory">Inventory</a>
      <a href="/customers">Customers</a>
      <a href="/rental-history">History</a>
      <a href="/new-rental" class="btn-accent">+ New Rental</a>
    </nav>
  </div>
</header>
<main>
  <h1>Rental History</h1>
  <p class="subtitle">Every rental ever recorded, newest first.</p>

  <div class="panel">
    <table>
      <thead><tr><th>Unit</th><th>Type</th><th>Customer</th><th>Start</th><th>Due</th><th>Returned</th><th>Status</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div id="historyEmpty" class="empty" style="display:none;">No rentals recorded yet.</div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/rentalHistory.js"></script>
</body>
</html>
