<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Rental - Luxtronic Rental</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <h1>New Rental</h1>
  <p class="subtitle">Check out an available unit to a customer.</p>

  <form id="rentalForm">
    <div class="panel">
      <h2>Unit</h2>
      <label for="unitSearch">Search available units by label or serial</label>
      <input type="text" id="unitSearch" placeholder="Start typing...">
      <div id="unitResults" style="margin-top:8px;"></div>
      <div id="selectedUnit" class="alert alert-info" style="display:none; margin-top:10px;"></div>
      <div id="unitNote" class="alert alert-info" style="display:none; margin-top:10px;">No units are currently available. Add one in Inventory, or wait for a return.</div>
    </div>

    <div class="panel">
      <h2>Customer</h2>
      <div class="checkbox-row">
        <input type="checkbox" id="existingCustomerToggle">
        <label for="existingCustomerToggle" style="margin:0;">This is an existing customer</label>
      </div>

      <div id="existingCustomerBlock" style="display:none;">
        <label for="customerSearch">Search by name or phone</label>
        <input type="text" id="customerSearch" placeholder="Start typing...">
        <div id="customerResults" style="margin-top:8px;"></div>
        <div id="selectedCustomer" class="alert alert-info" style="display:none; margin-top:10px;"></div>
      </div>

      <div id="newCustomerBlock">
        <div class="field-row">
          <div>
            <label for="custName">Full Name</label>
            <input type="text" id="custName">
          </div>
          <div>
            <label for="custPhone">Phone</label>
            <input type="text" id="custPhone">
          </div>
        </div>
        <label for="custAddress">Address</label>
        <input type="text" id="custAddress">
        <label for="custEmail">Email (optional)</label>
        <input type="email" id="custEmail">
      </div>
    </div>

    <div class="panel">
      <h2>Rental Terms</h2>
      <div class="field-row">
        <div>
          <label for="startDate">Start Date</label>
          <input type="date" id="startDate" required>
        </div>
        <div>
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate" required>
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="rentalFee">Rental Fee ($)</label>
          <input type="number" step="0.01" id="rentalFee">
        </div>
        <div>
          <label for="feeFrequency">Per</label>
          <select id="feeFrequency">
            <option value="day">Day</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
          </select>
        </div>
      </div>
      <label for="finalFee">Final Rental Fee ($)</label>
      <input type="number" step="0.01" id="finalFee" placeholder="Leave blank unless giving a discount off the rate above">
      <label for="securityBond">Security Bond ($)</label>
      <input type="number" step="0.01" id="securityBond">
      <label for="accessoriesIncluded">Accessories Included</label>
      <input type="text" id="accessoriesIncluded" placeholder="e.g. Charger, Bag, Powerbank">
      <label for="notes">Notes</label>
      <textarea id="notes" rows="3"></textarea>
    </div>

    <div class="panel">
      <h2>Checkout Condition Photos (optional)</h2>
      <input type="file" id="checkoutPhotos" accept="image/*" multiple>
    </div>

    <div id="formError"></div>
    <div class="actions-bar">
      <button type="submit" class="btn btn-primary">Create Rental &amp; Continue</button>
    </div>
  </form>
</main>
<script src="/js/common.js"></script>
<script src="/js/newRental.js"></script>
</body>
</html>
