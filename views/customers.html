<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers - Luxtronic Rental</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <h1>Customers</h1>
  <p class="subtitle">Search by name or phone number.</p>

  <div class="panel">
    <input type="text" id="searchInput" placeholder="Search name or phone...">
  </div>

  <div class="panel">
    <table>
      <thead><tr><th>Name</th><th>Phone</th><th>Address</th><th></th></tr></thead>
      <tbody id="customersBody"></tbody>
    </table>
    <div id="customersEmpty" class="empty" style="display:none;">No customers found.</div>
  </div>

  <div class="panel" id="detailPanel" style="display:none;">
    <h2 id="detailName"></h2>
    <p class="subtitle" id="detailContact"></p>
    <h2>Rental History</h2>
    <table>
      <thead><tr><th>Unit</th><th>Start</th><th>Due</th><th>Returned</th></tr></thead>
      <tbody id="historyBody"></tbody>
    </table>
    <div id="historyEmpty" class="empty" style="display:none;">No rentals yet.</div>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/customers.js"></script>
</body>
</html>
