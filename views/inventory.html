<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory - Luxtronic Rental</title>
<link rel="icon" type="image/png" href="/images/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="header">
  <div class="logo-container">
    <img src="/images/logo.png" alt="Luxtronic" class="logo-img">
    <a href="/" class="brand-name">LUXTRONIC</a>
    <span class="tagline">Rental Tracker</span>
  </div>
  <div class="dark-mode-toggle" id="darkModeToggle"><i class="fas fa-moon" id="themeIcon"></i></div>
</header>
<nav class="nav-bar">
  <a href="/" class="nav-item"><i class="fas fa-gauge-high"></i><span class="nav-text">Dashboard</span></a>
  <a href="/inventory" class="nav-item"><i class="fas fa-desktop"></i><span class="nav-text">Inventory</span></a>
  <a href="/customers" class="nav-item"><i class="fas fa-users"></i><span class="nav-text">Customers</span></a>
  <a href="/rental-history" class="nav-item"><i class="fas fa-clock-rotate-left"></i><span class="nav-text">History</span></a>
  <a href="/new-rental" class="nav-item nav-item-accent"><i class="fas fa-plus"></i><span class="nav-text">New Rental</span></a>
</nav>
<main>
  <h1>Inventory</h1>
  <p class="subtitle">All rental units, desktop and laptop.</p>

  <div class="grid-2">
    <div class="panel" style="grid-column: 1 / -1;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h2 style="margin:0;">Units</h2>
        <button class="btn btn-primary" id="addUnitBtn">+ Add Unit</button>
      </div>
      <div id="unitsError"></div>
      <table>
        <thead><tr><th>Label</th><th>Type</th><th>Specs</th><th>Serial</th><th>Est. Value</th><th>Status</th><th>Currently With</th><th></th></tr></thead>
        <tbody id="unitsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel" id="unitFormPanel" style="display:none;">
    <h2 id="unitFormTitle">Add Unit</h2>
    <form id="unitForm">
      <input type="hidden" id="unitId">
      <div class="field-row">
        <div>
          <label for="unitType">Type</label>
          <select id="unitType" required>
            <option value="desktop">Desktop</option>
            <option value="laptop">Laptop</option>
          </select>
        </div>
        <div>
          <label for="unitLabel">Label / Nickname</label>
          <input type="text" id="unitLabel" placeholder="e.g. Unit 12" required>
        </div>
      </div>
      <div class="field-row">
        <div>
          <label for="unitSerial">Serial Number</label>
          <input type="text" id="unitSerial">
        </div>
        <div>
          <label for="unitValue">Estimate Value ($)</label>
          <input type="number" step="0.01" id="unitValue">
        </div>
      </div>
      <label for="unitAccessories">Accessories</label>
      <input type="text" id="unitAccessories" placeholder="e.g. Charger, Bag">

      <label for="unitSpecs">Specs (one per line, e.g. "CPU: Intel i5-12600KF")</label>
      <textarea id="unitSpecs" rows="6" placeholder="CPU: ...&#10;RAM: ...&#10;GPU: ..."></textarea>

      <label for="unitManualStatus">Manual Status Override</label>
      <select id="unitManualStatus">
        <option value="none">None (normal availability rules apply)</option>
        <option value="in_repair">In Repair</option>
        <option value="retired">Retired</option>
      </select>

      <div class="actions-bar">
        <button type="submit" class="btn btn-primary">Save Unit</button>
        <button type="button" class="btn" id="cancelUnitForm">Cancel</button>
      </div>
      <div id="unitFormError"></div>
    </form>
  </div>
</main>
<script src="/js/common.js"></script>
<script src="/js/inventory.js"></script>
</body>
</html>
